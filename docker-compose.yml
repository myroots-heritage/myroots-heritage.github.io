services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: myroots
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: myroots
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["myroots_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myroots"]
      interval: 5s
      retries: 5
volumes:
  myroots_data:
